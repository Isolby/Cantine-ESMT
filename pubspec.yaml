name: projet_flutter
description: "Application de gestion de commandes pour cantine universitaire"

# Empêche la publication accidentelle sur pub.dev
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.8.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Firebase 
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.0
  cloud_firestore: ^4.17.5
  cloud_functions: ^4.6.0
  firebase_storage: ^11.6.0
  firebase_messaging: ^14.9.4
  image_picker: ^1.0.7

  # State Management
  provider: ^6.1.5

  # Utils
  intl: ^0.19.0
  http: ^1.1.0

  # Notifications locales
  flutter_local_notifications: ^19.5.0

  # Icons iOS
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/audios/
    - assets/pdfs/
    - assets/videos/

  # Décommentez si vous ajoutez des polices personnalisées
  # fonts:
  #   - family: Roboto
  #     fonts:
  #       - asset: fonts/Roboto-Regular.ttf
  #       - asset: fonts/Roboto-Bold.ttf
  #         weight: 700

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/mon-icone.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icons/mon-icone.png"
    background_color: "#ffffff"
    theme_color: "#ffffff"
  windows:
    generate: true
    image_path: "assets/icons/mon-icone.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/icons/mon-icone.png"